<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HAWI — Order Your Ethiopian Favourites</title>
    <meta name="description" content="Scan, browse and order authentic Ethiopian dishes at HAWI. Place your order directly to the kitchen." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              midnight: "#111111", charcoal: "#444444", steel: "#777777",
              cloud: "#F9FAFB", cool: "#E5E7EB", primary: "#E43D30",
              coral: "#F15A3C", orange: "#F97316", salmon: "#FF6B6B", gold: "#D4A843",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              display: ["'Plus Jakarta Sans'", "Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body { font-family: Inter, system-ui, sans-serif; background: #F9FAFB; color: #111111; }
      h1,h2,h3,h4 { font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; }
      .brand-grad { background-image: linear-gradient(90deg, #E43D30 0%, #F15A3C 50%, #F97316 100%); }
      .brand-text { background-image: linear-gradient(90deg,#E43D30,#F15A3C,#F97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .glass-nav { background: rgba(255,255,255,0.88); backdrop-filter: blur(16px); border-bottom: 1px solid #E5E7EB; }
      .card { background:#fff; border:1px solid #E5E7EB; border-radius:1rem; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease; }
      .card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -10px rgba(228,61,48,0.12); }
      .reveal { opacity:0; transform: translateY(28px) scale(.985); transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1); will-change: opacity, transform; }
      .reveal.in { opacity:1; transform:none; }
      .float-slow { animation: floaty 7s ease-in-out infinite; }
      @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
      @keyframes toastUp { from{opacity:0; transform:translate(-50%,20px)} to{opacity:1; transform:translate(-50%,0)} }
      .toast { animation: toastUp .25s ease-out; }
      .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg) } }
      @media (prefers-reduced-motion: reduce) { .reveal{opacity:1;transform:none;transition:none} .float-slow{animation:none} }
    </style>
  </head>
  <body class="min-h-screen">
    <!-- NAV -->
    <nav class="glass-nav fixed top-0 inset-x-0 z-40 h-20 flex items-center">
      <div class="mx-auto w-full max-w-6xl px-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="brand-grad w-11 h-11 rounded-2xl grid place-items-center text-white font-display text-lg">H</div>
          <div>
            <h1 class="text-lg leading-tight">HAWI</h1>
            <p class="text-xs text-steel">Ethiopian Kitchen</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span id="tableBadge" class="hidden sm:inline-flex items-center gap-1.5 rounded-full border border-cool bg-white px-3 py-1.5 text-xs font-semibold text-charcoal">
            <iconify-icon icon="lucide:armchair"></iconify-icon> Walk-in
          </span>
          <button id="cartBtn" class="relative brand-grad text-white font-bold rounded-xl px-4 py-2.5 text-sm flex items-center gap-2">
            <iconify-icon icon="lucide:shopping-bag"></iconify-icon> Cart
            <span id="cartCount" class="hidden absolute -top-2 -right-2 min-w-[22px] h-[22px] rounded-full bg-midnight text-white text-[11px] grid place-items-center px-1">0</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <header class="pt-28 pb-10 px-4">
      <div class="mx-auto max-w-6xl reveal">
        <div class="relative overflow-hidden rounded-[2rem] brand-grad text-white p-8 sm:p-12">
          <div class="absolute -right-10 -top-10 w-48 h-48 rounded-full bg-white/10 float-slow"></div>
          <div class="absolute -left-8 bottom--8 w-32 h-32 rounded-full bg-white/10 float-slow" style="animation-delay:1.4s"></div>
          <p class="text-white/85 text-sm font-semibold tracking-wide uppercase">Fresh from our kitchen</p>
          <h2 class="mt-2 text-3xl sm:text-5xl max-w-xl leading-tight">Authentic Ethiopian flavours, ordered from your table.</h2>
          <p class="mt-3 text-white/85 max-w-lg">Browse today's menu, build your order and send it straight to the kitchen.</p>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 pb-28">
      <div id="pills" class="flex flex-wrap gap-2 mb-6 reveal"></div>
      <div id="stateBox" class="hidden card p-10 text-center"></div>
      <div id="grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <!-- CART DRAWER -->
    <div id="cartOverlay" class="hidden fixed inset-0 z-50 bg-midnight/40"></div>
    <aside id="cartDrawer" class="fixed z-50 top-0 right-0 h-full w-full sm:w-[420px] bg-white border-l border-cool translate-x-full transition-transform duration-300 flex flex-col">
      <div class="h-20 px-5 flex items-center justify-between border-b border-cool">
        <h3 class="text-lg">Your Order</h3>
        <button id="cartClose" class="w-10 h-10 rounded-xl border border-cool grid place-items-center"><iconify-icon icon="lucide:x"></iconify-icon></button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
      <div class="border-t border-cool p-5 space-y-3">
        <p class="text-xs text-steel text-center">Your order goes straight to the kitchen — pay the staff when you arrive.</p>
        <div class="flex items-center justify-between text-sm text-steel"><span>Total</span><span id="cartTotal" class="text-xl font-display text-midnight">0.00 ETB</span></div>
        <button id="placeOrderBtn" class="brand-grad w-full text-white font-bold rounded-xl py-3.5 disabled:opacity-40">Place Order</button>
      </div>
    </aside>

    <div id="toasts" class="fixed z-[90] bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2"></div>

    <script>
      const SUPABASE_URL = "https://jqyrjrhwgintuxhsxpsu.supabase.co";
      const SUPABASE_KEY = "sb_publishable_i_TU_cb2C3TitU9wGAyHmw_cX5cPKMi";
      const H = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };
      const $ = (s) => document.querySelector(s);
      const money = (n) => Number(n || 0).toFixed(2) + " ETB";
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      function toast(msg, kind) {
        const el = document.createElement("div");
        el.className = "toast rounded-full px-4 py-2.5 text-sm font-semibold text-white shadow-lg " + (kind === "error" ? "bg-primary" : "bg-midnight");
        el.textContent = msg;
        $("#toasts").appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }

      async function describeFailure(res, what) {
        let body = "";
        try { body = (await res.text()).slice(0, 220); } catch (_) {}
        return `${what} — ${res.status} ${res.statusText}${body ? ": " + body : ""}`;
      }

      // ---------- scroll reveal ----------
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e, i) => { if (e.isIntersecting) { setTimeout(() => e.target.classList.add("in"), i * 60); io.unobserve(e.target); } });
      }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
      const observeReveals = () => document.querySelectorAll(".reveal:not(.in)").forEach((el) => io.observe(el));

      // ---------- state ----------
      const params = new URLSearchParams(location.search);
      const TABLE = params.get("table") || "";
      let MENU = [], FILTER = "All", CART = {};

      if (TABLE) {
        const b = $("#tableBadge");
        b.classList.remove("hidden");
        b.innerHTML = '<iconify-icon icon="lucide:armchair"></iconify-icon> Table ' + esc(TABLE);
      }

      function showState(icon, title, text, tone) {
        $("#grid").innerHTML = "";
        const box = $("#stateBox");
        box.classList.remove("hidden");
        box.innerHTML = `<div class="mx-auto w-14 h-14 rounded-2xl grid place-items-center text-2xl ${tone === "error" ? "bg-primary/10 text-primary" : "bg-cloud text-steel"}"><iconify-icon icon="${icon}" class="${icon.includes("loader") ? "spin" : ""}"></iconify-icon></div>
          <h3 class="mt-4 text-lg">${esc(title)}</h3><p class="mt-1 text-sm text-steel">${esc(text)}</p>`;
      }

      async function loadMenu() {
        showState("lucide:loader-2", "Loading today's menu", "One moment please…");
        let rows;
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/menus?select=*&is_active_today=eq.true&order=category.asc,name.asc`, { headers: H });
          if (!res.ok) throw new Error(await describeFailure(res, "Could not load the menu"));
          rows = await res.json();
        } catch (err) {
          showState("lucide:wifi-off", "Menu unavailable", err.message || "Network request failed — please check your connection.", "error");
          return;
        }
        MENU = Array.isArray(rows) ? rows : [];
        if (!MENU.length) { $("#pills").innerHTML = ""; showState("lucide:utensils", "No dishes yet", "The kitchen hasn't published today's menu. Please check back shortly."); return; }
        $("#stateBox").classList.add("hidden");
        renderPills();
        renderGrid();
      }

      function renderPills() {
        const cats = ["All", ...Array.from(new Set(MENU.map((m) => m.category).filter(Boolean)))];
        $("#pills").innerHTML = cats.map((c) => {
          const on = c === FILTER;
          return `<button data-cat="${esc(c)}" class="rounded-full px-4 py-2 text-sm font-semibold transition ${on ? "brand-grad text-white" : "bg-white border border-cool text-charcoal hover:border-coral"}">${esc(c)}</button>`;
        }).join("");
        $("#pills").querySelectorAll("button").forEach((b) => b.onclick = () => { FILTER = b.dataset.cat; renderPills(); renderGrid(); });
      }

      function renderGrid() {
        const items = FILTER === "All" ? MENU : MENU.filter((m) => m.category === FILTER);
        $("#grid").innerHTML = items.map((m) => {
          const qty = CART[m.id]?.qty || 0;
          const img = m.image_url
            ? `<img src="${esc(m.image_url)}" alt="${esc(m.name)}" loading="lazy" class="w-full h-44 object-cover" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div style="display:none" class="w-full h-44 place-items-center bg-cloud text-steel text-3xl"><iconify-icon icon="lucide:image-off"></iconify-icon></div>`
            : `<div class="w-full h-44 grid place-items-center bg-cloud text-steel text-3xl"><iconify-icon icon="lucide:utensils-crossed"></iconify-icon></div>`;
          return `<article class="card reveal overflow-hidden flex flex-col">
            <div class="relative">${img}<span class="absolute top-3 left-3 rounded-full bg-white/95 border border-cool px-2.5 py-1 text-[11px] font-bold text-charcoal">${esc(m.category || "Dish")}</span></div>
            <div class="p-5 flex flex-col gap-2 flex-1">
              <h3 class="text-base">${esc(m.name)}</h3>
              <p class="text-sm text-steel line-clamp-2 flex-1">${esc(m.description || "")}</p>
              <div class="flex items-center justify-between pt-2">
                <span class="font-display text-lg brand-text">${money(m.price)}</span>
                ${qty ? `<div class="flex items-center gap-2">
                    <button data-dec="${m.id}" class="w-9 h-9 rounded-xl border border-cool grid place-items-center"><iconify-icon icon="lucide:minus"></iconify-icon></button>
                    <span class="w-6 text-center font-bold">${qty}</span>
                    <button data-inc="${m.id}" class="w-9 h-9 rounded-xl brand-grad text-white grid place-items-center"><iconify-icon icon="lucide:plus"></iconify-icon></button>
                  </div>`
                  : `<button data-add="${m.id}" class="brand-grad text-white font-bold rounded-xl px-4 py-2 text-sm flex items-center gap-1.5"><iconify-icon icon="lucide:plus"></iconify-icon> Add</button>`}
              </div>
            </div>
          </article>`;
        }).join("");
        $("#grid").querySelectorAll("[data-add]").forEach((b) => b.onclick = () => changeQty(b.dataset.add, 1, true));
        $("#grid").querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => changeQty(b.dataset.inc, 1));
        $("#grid").querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => changeQty(b.dataset.dec, -1));
        observeReveals();
      }

      function changeQty(id, delta, announce) {
        const item = MENU.find((m) => m.id === id);
        if (!item) return;
        const cur = CART[id]?.qty || 0;
        const next = cur + delta;
        if (next <= 0) delete CART[id];
        else CART[id] = { id: item.id, name: item.name, price: Number(item.price), qty: next };
        if (announce) toast(item.name + " added to cart");
        renderGrid(); renderCart();
      }

      const cartList = () => Object.values(CART);
      const cartTotal = () => cartList().reduce((s, i) => s + i.price * i.qty, 0);

      function renderCart() {
        const items = cartList();
        const c = $("#cartCount");
        const count = items.reduce((s, i) => s + i.qty, 0);
        c.textContent = count; c.classList.toggle("hidden", count === 0);
        $("#cartTotal").textContent = money(cartTotal());
        $("#placeOrderBtn").disabled = items.length === 0;
        $("#cartItems").innerHTML = items.length
          ? items.map((i) => `<div class="card p-4 flex items-center gap-3">
              <div class="flex-1"><p class="font-semibold text-sm">${esc(i.name)}</p><p class="text-xs text-steel">${money(i.price)} each</p></div>
              <div class="flex items-center gap-2">
                <button data-cdec="${i.id}" class="w-8 h-8 rounded-lg border border-cool grid place-items-center"><iconify-icon icon="lucide:minus"></iconify-icon></button>
                <span class="w-5 text-center text-sm font-bold">${i.qty}</span>
                <button data-cinc="${i.id}" class="w-8 h-8 rounded-lg brand-grad text-white grid place-items-center"><iconify-icon icon="lucide:plus"></iconify-icon></button>
              </div>
              <span class="w-24 text-right text-sm font-display">${money(i.price * i.qty)}</span>
            </div>`).join("")
          : `<div class="text-center py-16 text-steel text-sm"><div class="text-4xl mb-2"><iconify-icon icon="lucide:shopping-bag"></iconify-icon></div>Your cart is empty.</div>`;
        $("#cartItems").querySelectorAll("[data-cinc]").forEach((b) => b.onclick = () => changeQty(b.dataset.cinc, 1));
        $("#cartItems").querySelectorAll("[data-cdec]").forEach((b) => b.onclick = () => changeQty(b.dataset.cdec, -1));
      }

      function openCart(open) {
        $("#cartDrawer").classList.toggle("translate-x-full", !open);
        $("#cartOverlay").classList.toggle("hidden", !open);
      }
      $("#cartBtn").onclick = () => openCart(true);
      $("#cartClose").onclick = () => openCart(false);
      $("#cartOverlay").onclick = () => openCart(false);

      // ---------- place order directly (no payment, no scheduling) ----------
      $("#placeOrderBtn").onclick = async () => {
        const items = cartList();
        if (!items.length) return;
        const btn = $("#placeOrderBtn");
        btn.disabled = true; btn.textContent = "Sending order…";
        try {
          const payload = {
            table_number: TABLE || "Walk-in",
            items: items,
            total_amount: Number(cartTotal().toFixed(2)),
            status: "received",
          };
          const ins = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
            method: "POST",
            headers: { ...H, "Content-Type": "application/json", Prefer: "return=representation" },
            body: JSON.stringify(payload),
          });
          if (!ins.ok) throw new Error(await describeFailure(ins, "Could not submit your order"));
        } catch (err) {
          btn.disabled = false; btn.textContent = "Place Order";
          toast(err.message || "Order could not be submitted", "error");
          return;
        }
        btn.disabled = false; btn.textContent = "Place Order";
        CART = {};
        openCart(false);
        renderCart(); renderGrid();
        toast("Order placed — thank you!");
      };

      renderCart();
      observeReveals();
      loadMenu();
    </script>
  </body>
</html>
